<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everyworld</title>
<meta name="description" content="Fractal planets from orbit to pebbles, in the browser. After Ken Musgrave's MojoWorld.">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <header id="menubar">
    <nav id="menus" aria-label="Menu bar"></nav>
    <div id="title">Everyworld - [<span id="wname">Loading</span>]</div>
  </header>
  <div id="work">
    <aside id="hot" hidden aria-label="Generator hot buttons"></aside>
    <main id="stage">
      <div id="rtr">
        <canvas id="view" aria-label="Real time render of the current planet"></canvas>
        <div id="pauseMark" hidden title="The RTR is paused. Click Jump to restart it.">II</div>
        <div id="readout" aria-live="off"></div>
        <div id="crop" hidden><span class="clabel">Crop</span><i class="h tl"></i><i class="h br"></i><button class="zoom" title="Crop Zoom: frame the crop area">⌕</button></div>
        <div id="jognav"></div>
        <div id="randomcam"></div>
        <div id="flash"></div>
      </div>
      <div id="ctrlbar"></div>
      <div id="lower">
        <section id="mixer" aria-label="Hyperspace Mixer"></section>
        <section id="panels" aria-label="Panels">
          <div id="ptools" role="tablist"></div>
          <div id="pbody"></div>
        </section>
      </div>
    </main>
  </div>
  <div id="windows"></div>
</div>
<div id="modal" hidden></div>
<div id="fail" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
